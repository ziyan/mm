# mm follows the project coding standard (see CONTRIBUTING.md). All
# analyzers are on; the per-project compounds list lets domain words
# survive DP segmentation as a single piece.

linters:
  mulint_camelcase:    true
  mulint_naming:       true
  mulint_abbreviation: true
  mulint_singleletter: true
  mulint_errorprefix:  true
  mulint_log:          true
  mulint_recover:      true
  mulint_structtag:    true

reports:
  maximumReportsPerLinter: 25

extra:
  compounds:
    # web hooks are universally written as one word; mulint's default
    # segmentation splits them. Keep webhookCommand / webhookListIncomingRun
    # / etc. intact.
    - webhook
